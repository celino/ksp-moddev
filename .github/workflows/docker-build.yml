name: Build image

# Checks that the image still builds. Nothing is pushed anywhere: the image
# carries the Unity Editor and Unity Hub, so it stays a local build
# (docker compose build) and everyone activates Unity with their own ID.

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "docs/**" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "docs/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: false
