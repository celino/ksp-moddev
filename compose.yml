# ksp-moddev: `docker compose run --rm moddev moddev-selftest` checks the image;
# `docker compose up -d` starts the virtual desktop (noVNC on 127.0.0.1:6080).
name: ksp-moddev

services:
  moddev:
    build:
      context: .
      args:
        USER_UID: ${MODDEV_UID:-1000}
        USER_GID: ${MODDEV_GID:-1000}
    image: ksp-moddev:2019.4.18f1
    container_name: ksp-moddev
    # Unity binds the license to the machine; a fixed hostname and MAC keep it
    # valid when the container is recreated.
    hostname: ksp-moddev
    mac_address: "02:42:4b:53:50:01"
    command: moddev-gui
    shm_size: 2gb
    ports:
      - "127.0.0.1:6080:6080"     # local only; from elsewhere, use an SSH tunnel
    environment:
      MODDEV_GEOMETRY: ${MODDEV_GEOMETRY:-1920x1080x24}
    volumes:
      - home:/home/modder                       # Unity license, Hub config, caches
      - parttools:/opt/parttools                # downloaded PartTools (never baked into the image)
      - ${KSP_WORK:-/mnt/projects/projects/ksp}:/work
      - ${KSP_GAME:-${HOME}/.steam/debian-installation/steamapps/common/Kerbal Space Program}:/ksp:ro

volumes:
  home:
  parttools:
