// Example scenario for TestDriver: Space Center -> editor -> Space Center, with ASSERT lines.
// Copy to GameData/zzTestDriver/scenario.cfg next to TestDriver.dll (run.sh does it).
// One key per line: KSP's config reader does not take several on one line.
TESTDRIVER
{
    name = minimal
    // a folder in saves/ (run.sh can copy one in with SAVE_FROM); leave it out to run from the main menu
    save = testdriver-run
    // seconds to wait after each scene is loaded, so the scene's addons can start
    settle = 10
    // the round ends with RESULT FAIL after this many seconds
    timeout = 600

    STEP
    {
        do = var
        key = scene0
        from = scene
    }

    STEP
    {
        do = expect
        key = scene0
        value = SPACECENTER
    }

    STEP
    {
        do = open
        scene = SPH
    }

    STEP
    {
        do = var
        key = scene1
        from = scene
    }

    STEP
    {
        do = expect
        key = scene1
        value = EDITOR
    }

    STEP
    {
        do = open
        scene = SPACECENTER
    }

    STEP
    {
        do = var
        key = funds
        from = funds
    }

    STEP
    {
        do = expect
        key = funds
        value = 0
        op = ge
    }

    STEP
    {
        do = var
        key = hasMM
        from = type
        of = ModuleManager.MMPatchLoader
    }

    STEP
    {
        do = expect
        key = hasMM
        value = 1
    }

    STEP
    {
        do = shot
        name = end
    }
}
